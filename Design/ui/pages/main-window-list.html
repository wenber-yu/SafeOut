<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主窗口 - 磁盘列表</title>
    <style id="theme-vars">
:root {
  --disk-background: #ffffff;
  --disk-foreground: #0f172a;
  --disk-card: rgba(255, 255, 255, 0.72);
  --disk-card-foreground: #0f172a;
  --disk-popover: rgba(255, 255, 255, 0.86);
  --disk-popover-foreground: #0f172a;
  --disk-primary: #0a84ff;
  --disk-primary-foreground: #ffffff;
  --disk-muted: rgba(120, 129, 144, 0.14);
  --disk-muted-foreground: #6b7280;
  --disk-border: rgba(0, 0, 0, 0.08);
  --disk-input: rgba(0, 0, 0, 0.06);
  --disk-ring: #0a84ff;
  --disk-radius-sm: 6px;
  --disk-radius-md: 10px;
  --disk-radius-lg: 16px;
  --disk-success: #34c759;
  --disk-warning: #ff9f0a;
  --disk-error: #ff453a;
  --disk-info: #0a84ff;
  --disk-font-sans: Inter, "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
  --disk-font-mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Monaco, Consolas, monospace;
}

.dark {
  --disk-background: #0b0b0f;
  --disk-foreground: #f8fafc;
  --disk-card: rgba(28, 28, 36, 0.72);
  --disk-card-foreground: #f8fafc;
  --disk-popover: rgba(28, 28, 36, 0.86);
  --disk-popover-foreground: #f8fafc;
  --disk-primary: #409cff;
  --disk-primary-foreground: #ffffff;
  --disk-muted: rgba(255, 255, 255, 0.10);
  --disk-muted-foreground: #9ca3af;
  --disk-border: rgba(255, 255, 255, 0.10);
  --disk-input: rgba(255, 255, 255, 0.08);
  --disk-ring: #409cff;
}

@media (prefers-color-scheme: dark) {
  :root:not(.light) {
    --disk-background: #0b0b0f;
    --disk-foreground: #f8fafc;
    --disk-card: rgba(28, 28, 36, 0.72);
    --disk-card-foreground: #f8fafc;
    --disk-popover: rgba(28, 28, 36, 0.86);
    --disk-popover-foreground: #f8fafc;
    --disk-primary: #409cff;
    --disk-primary-foreground: #ffffff;
    --disk-muted: rgba(255, 255, 255, 0.10);
    --disk-muted-foreground: #9ca3af;
    --disk-border: rgba(255, 255, 255, 0.10);
    --disk-input: rgba(255, 255, 255, 0.08);
    --disk-ring: #409cff;
  }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/Dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/Dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--disk-background);
    --color-foreground: var(--disk-foreground);
    --color-card: var(--disk-card);
    --color-card-foreground: var(--disk-card-foreground);
    --color-popover: var(--disk-popover);
    --color-popover-foreground: var(--disk-popover-foreground);
    --color-primary: var(--disk-primary);
    --color-primary-foreground: var(--disk-primary-foreground);
    --color-muted: var(--disk-muted);
    --color-muted-foreground: var(--disk-muted-foreground);
    --color-border: var(--disk-border);
    --color-input: var(--disk-input);
    --color-ring: var(--disk-ring);
    --radius-sm: var(--disk-radius-sm);
    --radius-md: var(--disk-radius-md);
    --radius-lg: var(--disk-radius-lg);
  }
  @layer base {
    body { background: var(--disk-background); color: var(--disk-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--disk-background); }
      .text-background { color: var(--disk-background); }
      .border-background { border-color: var(--disk-background); }
      .ring-background { --tw-ring-color: var(--disk-background); }
      .bg-foreground { background-color: var(--disk-foreground); }
      .text-foreground { color: var(--disk-foreground); }
      .border-foreground { border-color: var(--disk-foreground); }
      .ring-foreground { --tw-ring-color: var(--disk-foreground); }
      .bg-card { background-color: var(--disk-card); }
      .text-card { color: var(--disk-card); }
      .border-card { border-color: var(--disk-card); }
      .ring-card { --tw-ring-color: var(--disk-card); }
      .bg-card-foreground { background-color: var(--disk-card-foreground); }
      .text-card-foreground { color: var(--disk-card-foreground); }
      .border-card-foreground { border-color: var(--disk-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--disk-card-foreground); }
      .bg-popover { background-color: var(--disk-popover); }
      .text-popover { color: var(--disk-popover); }
      .border-popover { border-color: var(--disk-popover); }
      .ring-popover { --tw-ring-color: var(--disk-popover); }
      .bg-popover-foreground { background-color: var(--disk-popover-foreground); }
      .text-popover-foreground { color: var(--disk-popover-foreground); }
      .border-popover-foreground { border-color: var(--disk-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--disk-popover-foreground); }
      .bg-primary { background-color: var(--disk-primary); }
      .text-primary { color: var(--disk-primary); }
      .border-primary { border-color: var(--disk-primary); }
      .ring-primary { --tw-ring-color: var(--disk-primary); }
      .bg-primary-foreground { background-color: var(--disk-primary-foreground); }
      .text-primary-foreground { color: var(--disk-primary-foreground); }
      .border-primary-foreground { border-color: var(--disk-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--disk-primary-foreground); }
      .bg-muted { background-color: var(--disk-muted); }
      .text-muted { color: var(--disk-muted); }
      .border-muted { border-color: var(--disk-muted); }
      .ring-muted { --tw-ring-color: var(--disk-muted); }
      .bg-muted-foreground { background-color: var(--disk-muted-foreground); }
      .text-muted-foreground { color: var(--disk-muted-foreground); }
      .border-muted-foreground { border-color: var(--disk-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--disk-muted-foreground); }
      .bg-border { background-color: var(--disk-border); }
      .text-border { color: var(--disk-border); }
      .border-border { border-color: var(--disk-border); }
      .ring-border { --tw-ring-color: var(--disk-border); }
      .bg-input { background-color: var(--disk-input); }
      .text-input { color: var(--disk-input); }
      .border-input { border-color: var(--disk-input); }
      .ring-input { --tw-ring-color: var(--disk-input); }
      .bg-ring { background-color: var(--disk-ring); }
      .text-ring { color: var(--disk-ring); }
      .border-ring { border-color: var(--disk-ring); }
      .ring-ring { --tw-ring-color: var(--disk-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" data-viewport-mode="app-shell">
    <main>
        <div class="disk-shell" style="width:800px;height:520px;margin:40px auto;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,0.22);border:1px solid var(--disk-border);background:var(--disk-background);font-family:var(--disk-font-sans);">
            <!-- Titlebar / Toolbar -->
            <header style="height:52px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(255,255,255,0.65);border-bottom:1px solid var(--disk-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);">
                <h1 class="text-[15px] font-semibold text-foreground" style="letter-spacing:-0.01em;">SafeOut</h1>
                <div style="position:absolute;right:16px;display:flex;align-items:center;gap:8px;">
                    <button type="button" data-dom-id="refresh-disks" aria-label="刷新磁盘列表" class="inline-flex items-center justify-center w-8 h-8 rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-colors" style="border:none;background:transparent;cursor:pointer;">
                        <i data-lucide="arrow-clockwise" class="w-[18px] h-[18px]"></i>
                    </button>
                    <button type="button" data-dom-id="open-settings" aria-label="打开设置" class="inline-flex items-center justify-center w-8 h-8 rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-colors" style="border:none;background:transparent;cursor:pointer;">
                        <i data-lucide="gear" class="w-[18px] h-[18px]"></i>
                    </button>
                </div>
            </header>

            <!-- FDA Authorization Banner -->
            <div class="w-full flex items-center justify-between gap-3 px-4 py-3" style="flex:none;background:var(--disk-muted);border-bottom:1px solid var(--disk-border);">
                <div class="flex items-center gap-2.5 min-w-0">
                    <i data-lucide="lock" class="w-4 h-4 text-muted-foreground flex-shrink-0"></i>
                    <span class="text-[13px] text-foreground truncate">需要完全磁盘访问权限才能检测占用进程</span>
                </div>
                <button type="button" class="inline-flex items-center justify-center px-3 py-1.5 rounded-md text-[12px] font-medium text-primary hover:bg-primary/10 transition-colors" style="flex:none;border:none;background:transparent;cursor:pointer;">打开系统设置</button>
            </div>

            <!-- Scrollable Disk List -->
            <div data-scroll-region="primary" class="flex-1 overflow-y-auto" style="padding:16px;background:var(--disk-background);">
                <div class="space-y-4" style="display:flex;flex-direction:column;gap:16px;">
                    <!-- Card 1: Samsung T7 -->
                    <article class="disk-card" style="border-radius:var(--disk-radius-md);background:var(--disk-card);border:1px solid var(--disk-border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 2px rgba(0,0,0,0.04);padding:16px;display:flex;flex-direction:column;gap:14px;">
                        <div class="flex items-start gap-3">
                            <div class="inline-flex items-center justify-center w-10 h-10 rounded-lg flex-shrink-0" style="background:rgba(10,132,255,0.12);">
                                <i data-lucide="hard-drive" class="w-5 h-5 text-primary"></i>
                            </div>
                            <div class="min-w-0 flex-1" style="display:flex;flex-direction:column;gap:6px;">
                                <div class="flex items-center justify-between gap-3">
                                    <h2 class="text-[16px] font-semibold text-foreground truncate" style="letter-spacing:-0.01em;">Samsung T7</h2>
                                    <span class="text-[13px] text-muted-foreground flex-shrink-0">剩余 700 GB / 共 1 TB</span>
                                </div>
                                <div class="w-full h-1.5 rounded-full overflow-hidden" style="background:var(--disk-muted);">
                                    <div class="h-full rounded-full bg-primary" style="width:30%;"></div>
                                </div>
                            </div>
                        </div>

                        <div style="display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--disk-border);">
                            <p class="text-[12px] font-medium text-muted-foreground">以下进程正在占用此磁盘</p>
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-[12px] text-foreground" style="background:var(--disk-muted);border:1px solid var(--disk-border);">
                                    <i data-lucide="app-window" class="w-3.5 h-3.5 text-muted-foreground"></i>
                                    Finder.app
                                </span>
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-[12px] text-foreground" style="background:var(--disk-muted);border:1px solid var(--disk-border);">
                                    <i data-lucide="app-window" class="w-3.5 h-3.5 text-muted-foreground"></i>
                                    PhotoImport.app
                                </span>
                            </div>
                        </div>

                        <div class="flex items-center justify-end pt-1">
                            <button type="button" data-dom-id="eject-disk-samsung" class="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-md text-[13px] font-medium text-primary-foreground transition-colors hover:opacity-90" style="background:var(--disk-primary);border:none;cursor:pointer;">
                                <i data-lucide="eject" class="w-4 h-4"></i>
                                推出磁盘
                            </button>
                        </div>
                    </article>

                    <!-- Card 2: WD Blue -->
                    <article class="disk-card" style="border-radius:var(--disk-radius-md);background:var(--disk-card);border:1px solid var(--disk-border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 2px rgba(0,0,0,0.04);padding:16px;display:flex;flex-direction:column;gap:14px;">
                        <div class="flex items-start gap-3">
                            <div class="inline-flex items-center justify-center w-10 h-10 rounded-lg flex-shrink-0" style="background:rgba(10,132,255,0.12);">
                                <i data-lucide="hard-drive" class="w-5 h-5 text-primary"></i>
                            </div>
                            <div class="min-w-0 flex-1" style="display:flex;flex-direction:column;gap:6px;">
                                <div class="flex items-center justify-between gap-3">
                                    <h2 class="text-[16px] font-semibold text-foreground truncate" style="letter-spacing:-0.01em;">WD Blue</h2>
                                    <span class="text-[13px] text-muted-foreground flex-shrink-0">剩余 380 GB / 共 500 GB</span>
                                </div>
                                <div class="w-full h-1.5 rounded-full overflow-hidden" style="background:var(--disk-muted);">
                                    <div class="h-full rounded-full bg-primary" style="width:24%;"></div>
                                </div>
                            </div>
                        </div>

                        <div style="display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--disk-border);">
                            <p class="text-[12px] font-medium text-muted-foreground">可安全推出</p>
                            <div class="flex items-center gap-2">
                                <span class="inline-flex items-center gap-1.5 text-[13px] text-success">
                                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                                    无进程占用
                                </span>
                            </div>
                        </div>

                        <div class="flex items-center justify-end pt-1">
                            <button type="button" data-dom-id="eject-disk-wd" class="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-md text-[13px] font-medium text-primary-foreground transition-colors hover:opacity-90" style="background:var(--disk-primary);border:none;cursor:pointer;">
                                <i data-lucide="eject" class="w-4 h-4"></i>
                                推出磁盘
                            </button>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
