<ul>
<li><strong>界面文案改了一遍</strong>：把「更新组件未能启动」「注册已提交」这类只有开发看得懂的说法，换成你平时会用的说法</li>
<li><strong>统一了称呼</strong>：全应用现在一律叫「磁盘」，不再混着出现「硬盘」「卷」</li>
<li><strong>空状态的标题不再自相矛盾</strong>：窗口标题叫「外置磁盘」、空状态却叫「没有可移动磁盘」，看起来像筛选规则变了。现在两处一致</li>
<li><strong>授权说明写清是给哪个应用授权</strong>：不再只写「需要完全磁盘访问」</li>
<li><strong>几处啰嗦的句子缩短了</strong>：「完成后自动重启完成安装」→「装好后自动重启」</li>
<li><strong>繁体中文的用词保持不变</strong>：eject 仍按 Apple 官方译法写作「退出」，与系统里的访达菜单一致</li>
</ul>
