name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支上的多次推送只保留最新一次运行，避免排队浪费 CI 时长。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 脚本大量输出中文，显式固定 UTF-8 locale，避免 runner 默认 locale 下输出乱码。
  # ⚠️ **它不会改变 `Locale.current`**（实测：设了 `LC_ALL=en_US.UTF-8` 后
  # `Locale.current` 仍是 `zh_CN`）—— `Locale.current` 由 `AppleLocale` 决定。
  # 所以**不能用它来复现「CI 上文案类断言失败」**；CI 的英文环境来自 runner 的系统语言。
  LC_ALL: en_US.UTF-8
  # 门槛失败时**全量回显**日志（0 = 不限行数）。
  # 本地默认只回显 30 行；CI 上必须全量 —— 否则断言消息会被截掉，
  # 只能反复推 CI 靠猜（2026-09-17 踩到：19 个 issue 只露出 12 个）。
  PREFLIGHT_FAIL_TAIL: "0"

jobs:
  quality:
    name: 构建 · 格式 · 测试
    # runner 的 Xcode 选型必须与 Package.swift 的 tools version 对齐：
    # macos-15 镜像只提供 Xcode 16 系（Swift 6.1），而本包声明的是 6.3，
    # 会在预检门槛 1 直接报「package is using Swift tools version 6.3
    # but the installed version is 6.1」。macOS 26 镜像对应 Xcode 26（Swift 6.3.x）。
    # 注意 runner-images 的策略是「每个 macOS 版本只支持一个 Xcode 主版本」，
    # 所以升 tools version 时必须同步升 runner，否则 CI 必然红。
    runs-on: macos-26

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          # 同一镜像内会并存该主版本的多个 Xcode（26.0 / 26.1 / ...），默认未必指向最新，
          # 显式选最新那个，避免因默认版本偏低而误报 tools version 不满足。
          LATEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
            echo "已选用 Xcode：$LATEST"
          fi
          swift --version
          xcrun swift-format --version

      # 门槛全部封装在 Scripts/preflight.sh 里 —— 本地跑的是**同一个文件**
      # （`./run.sh check --with-tests`），因此不存在「本地判据与 CI 判据分叉」的可能。
      # 本仓库曾因两侧不一致，让 13 条 Swift 6 并发错误在本地一路绿灯的情况下潜伏三天。
      # ⚠️ 这里**不写门槛数量**（门槛会加，数字会漂 —— 本行曾写「三道」，而实际早已不是了）。
      #    要清单就跑 `./run.sh check`：它逐道打印标题，那份输出才是权威。
      - name: 代码门槛（Scripts/preflight.sh --with-tests）
        run: ./Scripts/preflight.sh --with-tests

      # ⚠️ **绿的时候也要把门槛日志传出来**（2026-09-23，账本 #51）。
      #
      # 门槛**成功**时 `run_gate` 只回显尾部 3 行，而测试全量输出落在
      # `.build/preflight/测试全量.log`（`coverage.sh` 写，跑完不删）⇒
      # **逐条 `passed after` 一行都不进 CI 日志**（实测 `gh api .../logs`
      # 的 zip 解开只有 298 行、`passed after` **0 条**）⇒
      # 「CI 上那条测试慢了多少」永远只能靠再造一次失败去看（§8.135 就栽在这上面）。
      #
      # ⇒ 这里当 artifact 上传，事后 `./run.sh ci --logs` 下载下来 grep。
      #
      # ⚠️ `if: always()` **不能省**：门槛一红，后面的步骤默认全被跳过，
      #    而**红的那一轮恰恰最需要日志** —— 少了它，这条只对绿跑生效。
      #    （绿跑才是这次要补的那一半；红跑本来就有 `--log-failed`。）
      - name: 上传门槛日志（含绿跑的逐条测试耗时）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-logs
          path: .build/preflight/
          # 有就传、没有也别把 CI 判红：日志不是判据，缺了只该提醒。
          if-no-files-found: warn
          retention-days: 7

      # 打包验证：确认 .app 能构建出来且签名步骤不报错。
      # 提前发现 Info.plist / 资源拷贝 / codesign 环节的问题，
      # 而不是等到准备上架时才发现打不出包。
      - name: 打包验证
        run: ./build_app.sh

      # ⚠️ **不是**「列出几个文件名」就完事（2026-09-20 之前正是这样）⇒
      # 「包能构建出来」被当成了「包是对的」。而下面每一条缺失时**打包都一路绿灯**：
      #   · 缺 `SUPublicEDKey` ⇒ Sparkle **跳过验签**（中间人可推任意版本），只在 stderr 打个警告；
      #   · 缺 `Contents/Frameworks/Sparkle.framework` ⇒ **一运行就崩**（dyld 找不到），构建不会失败；
      #   · 缺 `SUFeedURL` ⇒ 「检查更新」永远成功、永远说「已是最新版本」（§8.94 那个病）。
      # ⇒ 判据读**产物**（Info.plist / 目录 / codesign），不读源码 —— 拿源码跟自己比是没牙的守卫。
      - name: 产物自检（读打出来的包，不是读源码）
        run: ./Scripts/verify_app.sh Dist/SafeOut.app
